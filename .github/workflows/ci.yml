name: CI

on:
  push:
    branches: [main, v3_Python_Cursor+GPT]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m venv venv_iron-air-modeling
          venv_iron-air-modeling/bin/pip install -U pip
          venv_iron-air-modeling/bin/pip install -e ".[dev,notebooks]"
      - name: Lint
        run: |
          venv_iron-air-modeling/bin/ruff check src tests
          venv_iron-air-modeling/bin/ruff format --check src tests
      - name: Typecheck
        run: venv_iron-air-modeling/bin/mypy src/ironair
      - name: Tests with coverage
        run: |
          venv_iron-air-modeling/bin/coverage run -m pytest
          venv_iron-air-modeling/bin/coverage report --fail-under=80
          venv_iron-air-modeling/bin/coverage xml
      - name: StrictDoc
        run: venv_iron-air-modeling/bin/strictdoc inspect-requirements reqs

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          python -m pip install pip-audit
          pip-audit -r <(python -c "print('numpy==2.2.4\nscipy==1.15.2\npandas==2.2.3')")
