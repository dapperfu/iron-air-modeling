[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ironair"
version = "1.0.0"
description = "Python multiphysics iron-air battery simulation framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "iron-air-modeling contributors" }]
dependencies = [
    "numpy==2.2.4",
    "scipy==1.15.2",
    "pandas==2.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "coverage>=7.6.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pandas-stubs>=2.2.0",
    "pre-commit>=4.0.0",
    "strictdoc>=0.9.0",
    "pip-audit>=2.7.0",
]
notebooks = [
    "matplotlib==3.10.1",
    "seaborn==0.13.2",
    "jupyter>=1.1.0",
    "ipykernel>=6.29.0",
    "nbformat>=5.10.0",
    "nbclient>=0.10.0",
]

[project.urls]
Homepage = "https://github.com/dapperfu/iron-air-modeling"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "phase1: Phase 1 foundation gate",
    "phase2: Phase 2 chemistry gate",
    "phase3: Phase 3 chemistry notebooks",
    "notebook: executes Jupyter notebooks",
    "slow: long-running simulations",
]
addopts = "-q"

[tool.coverage.run]
source = ["ironair"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["ironair"]
mypy_path = "src"
warn_unused_ignores = true
disallow_untyped_defs = true
